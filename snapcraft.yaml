name: mynews
adopt-info: mynews
summary: Personalized news feed parser & broadcast
description: Easily specify your RSS/Atom sources and broadcast preferences to get personalized news feed.
base: core24
confinement: strict
grade: stable
parts:
  mynews:
    plugin: go
    source: .
    build-snaps:
      - go/latest/stable
    # Take the version from git so store builds stop reusing a hard-coded
    # number: a tag builds as "3.0.0", a later main commit as "3.0.0-8-g799a0c8".
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags --always | sed 's/^v//')"
apps:
  mynews:
    environment:
      MYNEWS_CONFIG_FILE: $SNAP_COMMON/config.json
      MYNEWS_STORAGE_FILE: $SNAP_COMMON/data.json
    command: bin/mynews
    plugs:
      - network
  mynewsd:
    environment:
      MYNEWS_CONFIG_FILE: $SNAP_COMMON/config.json
      MYNEWS_STORAGE_FILE: $SNAP_COMMON/data.json
    command: bin/mynews
    daemon: simple
    plugs:
      - network
